<!DOCTYPE html>
<html>
<head>
  <title>Prime Nexus</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0; /* Remove default margin */
      overflow: hidden; /* Prevent scrollbars */
      background-color: #111827; /* Dark background */
      color: #e5e7eb; /* Light text color for contrast */
    }
    #3d-canvas-container {
      width: 100vw; /* Full viewport width */
      height: 100vh; /* Full viewport height */
      display: block; /* Ensure it behaves as a block element */
    }
    h1 {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        font-size: 1.5rem;
        color: #9ca3af; /* Subdued title color */
    }
  </style>
</head>
<body>
  <h1>Welcome to the Prime Nexus - Click a Die!</h1>
  <div id="3d-canvas-container"></div>

  <script>
    let scene, camera, renderer;
    let diceMeshes = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function init() {
      // Scene
      scene = new THREE.Scene();

      // Camera
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;

      // Renderer
      const canvasContainer = document.getElementById('3d-canvas-container');
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      canvasContainer.appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); // Softer ambient light
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8); // Stronger directional light
      directionalLight.position.set(5, 10, 7.5);
      scene.add(directionalLight);

      // Dice Definitions
      const diceData = [
        { name: "Business Services", geometry: new THREE.BoxGeometry(1, 1, 1), color: 0xff0000, position: new THREE.Vector3(-2.5, 1.5, 0), rotationSpeed: new THREE.Vector3(0.005, 0.007, 0) },
        { name: "Academy", geometry: new THREE.OctahedronGeometry(0.8, 0), color: 0x0000ff, position: new THREE.Vector3(2.5, 1.5, 0), rotationSpeed: new THREE.Vector3(0, 0.006, 0.004) },
        { name: "Applet Demos", geometry: new THREE.DodecahedronGeometry(0.7, 0), color: 0x00ff00, position: new THREE.Vector3(-2.5, -1.5, 0), rotationSpeed: new THREE.Vector3(0.008, 0, 0.003) },
        { name: "Instancing", geometry: new THREE.IcosahedronGeometry(0.65, 0), color: 0xffff00, position: new THREE.Vector3(2.5, -1.5, 0), rotationSpeed: new THREE.Vector3(0.004, 0.004, 0.004) }
      ];

      diceData.forEach(data => {
        const material = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.3, roughness: 0.6 });
        const mesh = new THREE.Mesh(data.geometry, material);
        mesh.position.copy(data.position);
        mesh.userData.name = data.name;
        mesh.userData.rotationSpeed = data.rotationSpeed; // Store rotation speed
        scene.add(mesh);
        diceMeshes.push(mesh);
      });

      // Event Listeners
      window.addEventListener('resize', onWindowResize, false);
      renderer.domElement.addEventListener('mousedown', onCanvasMouseDown, false);

      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onCanvasMouseDown(event) {
      // Calculate mouse position in normalized device coordinates (-1 to +1) for both components
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;

      // Update the picking ray with the camera and mouse position
      raycaster.setFromCamera(mouse, camera);

      // Calculate objects intersecting the picking ray
      const intersects = raycaster.intersectObjects(diceMeshes);

      if (intersects.length > 0) {
        const clickedDie = intersects[0].object;
        console.log(clickedDie.userData.name + " Die Clicked!");
        // Future: Implement navigation or interaction for the clicked die
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      // Animate dice rotation
      diceMeshes.forEach(die => {
        die.rotation.x += die.userData.rotationSpeed.x;
        die.rotation.y += die.userData.rotationSpeed.y;
        die.rotation.z += die.userData.rotationSpeed.z;
      });

      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
