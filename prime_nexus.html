<!DOCTYPE html>
<html>
<head>
  <title>Prime Nexus</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0; /* Remove default margin */
      overflow: hidden; /* Prevent scrollbars */
      background-color: #000000; /* Darker background for stars */
      color: #e5e7eb; /* Light text color for contrast */
    }
    #3d-canvas-container {
      width: 100vw; /* Full viewport width */
      height: 100vh; /* Full viewport height */
      display: block; /* Ensure it behaves as a block element */
      cursor: pointer; /* Indicate interactivity */
    }
    h1 {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        font-size: 1.5rem;
        color: #9ca3af; /* Subdued title color */
        pointer-events: none; /* Make sure title doesn't interfere with clicks */
    }
  </style>
</head>
<body>
  <h1>Welcome to the Prime Nexus - Click a Die!</h1>
  <div id="3d-canvas-container"></div>

  <script>
    let scene, camera, renderer;
    let diceMeshes = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredDie = null; // To keep track of the currently hovered die

    function init() {
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000); // Black background for starfield

      // Camera
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000); // Increased far plane for stars
      camera.position.z = 5;

      // Renderer
      const canvasContainer = document.getElementById('3d-canvas-container');
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      canvasContainer.appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
      directionalLight.position.set(5, 10, 7.5);
      scene.add(directionalLight);

      // Dice Definitions
      const diceData = [
        { name: "Business Services", geometry: new THREE.BoxGeometry(1, 1, 1), color: 0xff0000, position: new THREE.Vector3(-2.5, 1.5, 0), rotationSpeed: new THREE.Vector3(0.005, 0.007, 0) },
        { name: "Academy", geometry: new THREE.OctahedronGeometry(0.8, 0), color: 0x0000ff, position: new THREE.Vector3(2.5, 1.5, 0), rotationSpeed: new THREE.Vector3(0, 0.006, 0.004) },
        { name: "Applet Demos", geometry: new THREE.DodecahedronGeometry(0.7, 0), color: 0x00ff00, position: new THREE.Vector3(-2.5, -1.5, 0), rotationSpeed: new THREE.Vector3(0.008, 0, 0.003) },
        { name: "Instancing", geometry: new THREE.IcosahedronGeometry(0.65, 0), color: 0xffff00, position: new THREE.Vector3(2.5, -1.5, 0), rotationSpeed: new THREE.Vector3(0.004, 0.004, 0.004) }
      ];

      diceData.forEach(data => {
        const material = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.2, roughness: 0.7, emissive: 0x000000 });
        const mesh = new THREE.Mesh(data.geometry, material);
        mesh.position.copy(data.position);
        mesh.userData.name = data.name;
        mesh.userData.rotationSpeed = data.rotationSpeed;
        mesh.userData.url = data.name.toLowerCase().replace(/\s+/g, '_') + '.html';
        mesh.userData.originalScale = new THREE.Vector3().copy(mesh.scale);
        mesh.userData.originalEmissive = material.emissive.getHex(); // Store initial emissive (should be 0x000000)
        scene.add(mesh);
        diceMeshes.push(mesh);
      });

      // Starfield
      const starGeometry = new THREE.BufferGeometry();
      const starVertices = [];
      for (let i = 0; i < 10000; i++) {
        const x = THREE.MathUtils.randFloatSpread(1500); // Spread stars wider
        const y = THREE.MathUtils.randFloatSpread(1500);
        const z = THREE.MathUtils.randFloatSpread(1500);
        starVertices.push(x, y, z);
      }
      starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
      const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, transparent: true, opacity: 0.8 });
      const stars = new THREE.Points(starGeometry, starMaterial);
      scene.add(stars);


      // Event Listeners
      window.addEventListener('resize', onWindowResize, false);
      renderer.domElement.addEventListener('mousedown', onCanvasMouseDown, false);
      renderer.domElement.addEventListener('mousemove', onCanvasMouseMove, false); // For hover effects

      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onCanvasMouseMove(event) {
        event.preventDefault();

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(diceMeshes);

        if (intersects.length > 0) {
            const firstIntersected = intersects[0].object;
            if (hoveredDie !== firstIntersected) {
                // Reset previously hovered die if there was one
                if (hoveredDie) {
                    hoveredDie.scale.copy(hoveredDie.userData.originalScale);
                    hoveredDie.material.emissive.setHex(hoveredDie.userData.originalEmissive);
                }
                hoveredDie = firstIntersected;
                // Apply hover effect
                hoveredDie.scale.multiplyScalar(1.1);
                hoveredDie.material.emissive.setHex(0x555555); // Subtle white glow
            }
        } else {
            // No intersection, reset if a die was hovered
            if (hoveredDie) {
                hoveredDie.scale.copy(hoveredDie.userData.originalScale);
                hoveredDie.material.emissive.setHex(hoveredDie.userData.originalEmissive);
                hoveredDie = null;
            }
        }
    }


    function onCanvasMouseDown(event) {
      event.preventDefault(); 

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(diceMeshes);

      if (intersects.length > 0) {
        const clickedDie = intersects[0].object;
        
        // Reset hover effect before navigation
        if (hoveredDie) {
            hoveredDie.scale.copy(hoveredDie.userData.originalScale);
            hoveredDie.material.emissive.setHex(hoveredDie.userData.originalEmissive);
            hoveredDie = null;
        }

        console.log(clickedDie.userData.name + " Die Clicked! Navigating to: " + clickedDie.userData.url);

        if (clickedDie.userData.url) {
            window.location.href = clickedDie.userData.url;
        } else {
            console.error("No URL defined for clicked die:", clickedDie.userData.name);
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      diceMeshes.forEach(die => {
        if (die.userData.rotationSpeed) {
            die.rotation.x += die.userData.rotationSpeed.x;
            die.rotation.y += die.userData.rotationSpeed.y;
            die.rotation.z += die.userData.rotationSpeed.z;
        }
      });

      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
