<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to MystraWorks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #000;
        }
        #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        #youtube-player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw; /* 16:9 aspect ratio */
            min-height: 100vh;
            min-width: 177.77vh; /* 16:9 aspect ratio for vertical coverage */
            transform: translate(-50%, -50%);
        }
        #click-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: pointer;
            background: rgba(0,0,0,0.5); /* Start with a dark overlay */
            opacity: 1;
            transition: opacity 1s ease-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }
        #click-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://esm.sh/firebase@^10.12.2/app",
        "firebase/auth": "https://esm.sh/firebase@^10.12.2/auth"
      }
    }
    </script>
</head>
<body>

    <div id="video-background">
        <!-- This div is the target for the YouTube API -->
        <div id="youtube-player"></div>
    </div>

    <!-- This overlay captures the first click to start the experience -->
    <div id="click-overlay">
        <h1 class="text-5xl md:text-8xl font-black mb-4 animate-pulse">MystraWorks</h1>
        <p class="text-lg md:text-2xl text-slate-300">Click anywhere to enter the Weave.</p>
    </div>

    <script>
        // Load the YouTube IFrame Player API code asynchronously.
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        const videoId = 'oTJQCWrQt8E'; // The 0-to-1 video ID
        let redirectTimer = null;

        // This function creates the player when the API is ready.
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                videoId: videoId,
                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    showinfo: 0,
                    modestbranding: 1,
                    loop: 0, // Play video only once
                    // playlist: videoId, // Not needed if loop is 0
                    fs: 0,
                    iv_load_policy: 3,
                    mute: 1,
                    playsinline: 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            console.log("YouTube Player is ready.");
        }
        
        // This function fires when the player's state changes (e.g., playing, paused, ended)
        function onPlayerStateChange(event) {
             // YT.PlayerState.ENDED is 0
             if (event.data === YT.PlayerState.ENDED) {
                console.log("Video playback ended. Redirecting to prime_nexus.html");
                if (redirectTimer) {
                    clearTimeout(redirectTimer);
                    redirectTimer = null;
                }
                window.location.href = 'prime_nexus.html';
             } else if (event.data === YT.PlayerState.PLAYING) {
                console.log("Video playback started.");
                // Fallback timer is set in startExperience.
             }
        }

        // The function to start the experience, triggered by the first click.
        function startExperience() {
            const overlay = document.getElementById('click-overlay');
            
            // Hide the overlay
            overlay.classList.add('hidden');

            // Player should attempt to play due to autoplay=1, mute=1 and user interaction.
            // Set a general fallback timer in case YouTube events don't fire as expected
            // or video stalls. This timer starts from the click.
            // If the ENDED event fires, it will clear this timer.
            if (redirectTimer) { // Clear any previous timer if function is somehow called again
                clearTimeout(redirectTimer);
            }
            // Video is ~9s. Fallback after 11s to give ENDED event a chance.
            redirectTimer = setTimeout(() => {
                console.log("Fallback timer expired. Redirecting to prime_nexus.html");
                window.location.href = 'prime_nexus.html';
            }, 11000); 
        }

        // Listen for the first click on the overlay.
        document.getElementById('click-overlay').addEventListener('click', startExperience, { once: true });
    </script>

<script type="module" src="js/logos-companion.js"></script>
<logos-companion></logos-companion>
</body>
</html>
