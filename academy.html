<!DOCTYPE html>
<html>
<head>
  <title>Academy - Orbital View</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "OrbitControls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js",
        "firebase/app": "https://esm.sh/firebase@^10.12.2/app",
        "firebase/auth": "https://esm.sh/firebase@^10.12.2/auth"
      }
    }
  </script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      overflow: hidden; /* Prevent scrollbars */
      background-color: #0a0514; /* Dark mystical purple */
      color: #e0e0e0; /* Default light text color */
    }
    #3d-canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none; /* Allow clicks to pass through to canvas */
    }
    .hud h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
      color: #e0e0e0; /* Light lavender/grey */
      text-shadow: 0 0 5px rgba(172, 102, 255, 0.5);
    }
    .hud a {
      color: #b39ddb; /* Lighter mystical purple for links */
      text-decoration: none;
      pointer-events: auto; /* Enable clicks on the link */
      font-size: 1rem;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }
    .hud a:hover {
      text-decoration: underline;
      color: #ede7f6; /* Brighter on hover */
      text-shadow: 0 0 8px rgba(220, 180, 255, 0.7);
    }
    #instructions {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background-color: rgba(30, 20, 50, 0.75); /* Dark translucent purple */
      color: #d1c4e9; /* Pale lavender */
      padding: 12px;
      border-radius: 8px; /* Slightly softer radius */
      font-size: 0.9em;
      z-index: 100;
      line-height: 1.4;
      border: 1px solid rgba(126, 87, 194, 0.4); /* Subtle border */
      box-shadow: 0 0 15px rgba(40, 20, 70, 0.5);
    }
  </style>
</head>
<body>
  <div class="hud">
    <h1>Welcome to the Academy</h1>
    <p><a href="prime_nexus.html">Back to Prime Nexus</a></p>
  </div>
  
  <div id="3d-canvas-container"></div>

  <div id="instructions">
    <p><strong>Controls:</strong></p>
    <p>&bull; Drag mouse to orbit camera.</p>
    <p>&bull; Scroll to zoom.</p>
    <p>&bull; Hold 'A' / 'D' to arm Focus Sling.</p>
    <p>&bull; Release 'A' / 'D' to sling camera.</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'OrbitControls';

    let scene, camera, renderer, controls;
    let triCons = [];
    // Flags for Focus Sling mechanic
    let isFocusing = false;
    let focusDirection = null; // 'left' or 'right'
    const originalBackgroundColor = new THREE.Color(0x0a0514);
    const focusLeftColor = new THREE.Color(0x330000); // Dark red
    const focusRightColor = new THREE.Color(0x003300); // Dark green

    let initialCameraDistance;

    function createGradientTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256; 
        canvas.height = 256;
        const context = canvas.getContext('2d');
        const gradient = context.createLinearGradient(0, canvas.height, 0, 0);
        gradient.addColorStop(0, '#3c1053'); 
        gradient.addColorStop(0.6, '#5c1f8b'); 
        gradient.addColorStop(1, '#7e57c2');   
        context.fillStyle = gradient;
        context.fillRect(0, 0, canvas.width, canvas.height);
        return new THREE.CanvasTexture(canvas);
    }

    function init() {
      scene = new THREE.Scene();
      scene.background = originalBackgroundColor.clone();

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.set(8, 7, 8);
      
      const canvasContainer = document.getElementById('3d-canvas-container');
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      canvasContainer.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
      directionalLight.position.set(8, 15, 10);
      directionalLight.castShadow = true; 
      scene.add(directionalLight);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 0.5, 0); 
      
      initialCameraDistance = camera.position.distanceTo(controls.target);

      const planeGeometry = new THREE.PlaneGeometry(14, 14);
      const gradientTexture = createGradientTexture();
      const planeMaterial = new THREE.MeshStandardMaterial({ 
        map: gradientTexture, 
        side: THREE.DoubleSide, 
        metalness: 0.2,
        roughness: 0.8
      });
      const plane = new THREE.Mesh(planeGeometry, planeMaterial);
      plane.rotation.x = -Math.PI / 2; 
      plane.receiveShadow = true; 
      scene.add(plane);

      const triConData = [
        { name: "Academy Resource 1", geometry: new THREE.SphereGeometry(0.5, 32, 16), color: 0xe53e3e, rotationSpeed: new THREE.Vector3(0, 0.005, 0) },
        { name: "Academy Resource 2", geometry: new THREE.TetrahedronGeometry(0.6, 0), color: 0x3182ce, rotationSpeed: new THREE.Vector3(0.003, 0.003, 0) },
        { name: "Academy Resource 3", geometry: new THREE.TorusKnotGeometry(0.4, 0.12, 100, 12), color: 0x38a169, rotationSpeed: new THREE.Vector3(0, -0.004, 0.002) },
        { name: "Academy Resource 4", geometry: new THREE.SphereGeometry(0.65, 32, 32), color: 0xdd6b20, rotationSpeed: new THREE.Vector3(0.006, 0, 0) }
      ];
      
      const radius = 3.5;
      const numTriCons = triConData.length;
      triConData.forEach((data, index) => {
        const angle = (index / numTriCons) * Math.PI * 2;
        const x = radius * Math.cos(angle);
        const z = radius * Math.sin(angle);
        
        const material = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.4, roughness: 0.5 });
        const mesh = new THREE.Mesh(data.geometry, material);
        mesh.position.set(x, 0.7, z);
        mesh.userData.name = data.name;
        mesh.userData.rotationSpeed = data.rotationSpeed;
        mesh.castShadow = true; 
        scene.add(mesh);
        triCons.push(mesh);
      });

      const starGeometry = new THREE.BufferGeometry();
      const starVertices = [];
      for (let i = 0; i < 15000; i++) {
        const x = THREE.MathUtils.randFloatSpread(1800);
        const y = THREE.MathUtils.randFloatSpread(1800);
        const z = THREE.MathUtils.randFloatSpread(1800);
        starVertices.push(x, y, z);
      }
      starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
      const starMaterial = new THREE.PointsMaterial({ 
          color: 0xffffff, 
          size: 0.8,
          transparent: true, 
          opacity: 0.7,
          blending: THREE.AdditiveBlending
        });
      const stars = new THREE.Points(starGeometry, starMaterial);
      scene.add(stars);
      
      updateZoomConstraints(true); 
      controls.update(); 

      window.addEventListener('resize', onWindowResize, false);
      window.addEventListener('keydown', onKeyDown, false);
      window.addEventListener('keyup', onKeyUp, false);
      console.log("Academy Initialized. Focus Sling mechanic active.");
      animate();
    }
    
    function getHorizontalFOV(verticalFOV, aspect) {
        return 2 * Math.atan(Math.tan(verticalFOV / 2) * aspect);
    }

    function updateZoomConstraints(isInitialSetup) {
        if (!controls || !camera) return;
        const triConCircleDiameter = 7.0;
        const largestTriConDiameter = 1.3; 
        const padding = 1.0;
        const requiredHorizontalSpan = triConCircleDiameter + largestTriConDiameter + padding;
        const verticalFOV = THREE.MathUtils.degToRad(camera.fov);
        const horizontalFOV = getHorizontalFOV(verticalFOV, camera.aspect);
        let minCalculatedDistance = requiredHorizontalSpan / (2 * Math.tan(horizontalFOV / 2));
        controls.minDistance = Math.max(2.0, minCalculatedDistance);
        if (isInitialSetup) {
            controls.maxDistance = initialCameraDistance * 1.5;
        }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateZoomConstraints(false); 
    }

    function onKeyDown(event) {
        const key = event.key.toLowerCase();
        if (key === 'a' || key === 'd') {
            event.preventDefault();
            if (isFocusing) return; // Already focusing, do nothing

            isFocusing = true;
            focusDirection = (key === 'a') ? 'left' : 'right';
            controls.enabled = false; // Disable controls during focus
            scene.background = (focusDirection === 'left') ? focusLeftColor.clone() : focusRightColor.clone();
            console.log("Focus Sling ARMED:", focusDirection);
        }
    }

    function onKeyUp(event) {
        const key = event.key.toLowerCase();
        if ((key === 'a' && focusDirection === 'left') || (key === 'd' && focusDirection === 'right')) {
            event.preventDefault();
            if (!isFocusing) return; // Not focusing, nothing to release

            controls.enabled = true; // Re-enable controls
            const slingAngle = Math.PI / 4; // 45-degree sling

            if (focusDirection === 'left') {
                controls.rotateLeft(slingAngle);
                console.log("Focus Sling: Rotated Left");
            } else if (focusDirection === 'right') {
                controls.rotateRight(slingAngle);
                console.log("Focus Sling: Rotated Right");
            }
            
            // controls.update(); // Ensure the rotation is applied/starts animating if damping

            scene.background = originalBackgroundColor.clone(); // Revert background
            console.log("Focus Sling RELEASED:", focusDirection);
            
            isFocusing = false;
            focusDirection = null;
        }
    }

    function animate() {
      requestAnimationFrame(animate);
      
      // Animate TriCons (even during focus, or maybe slow them down)
      triCons.forEach(tc => {
          if (tc.userData.rotationSpeed) {
              let speedFactor = isFocusing ? 0.2 : 1; // Slow down triCons during focus
              tc.rotation.x += tc.userData.rotationSpeed.x * speedFactor;
              tc.rotation.y += tc.userData.rotationSpeed.y * speedFactor;
              tc.rotation.z += tc.userData.rotationSpeed.z * speedFactor;
          }
      });

      // OrbitControls update needs to be called if damping is enabled,
      // or if any programmatic changes to camera (like autoRotate or manual rotateLeft/Right)
      // need to be smoothed out.
      // If controls.enabled is false, update() typically won't process user input
      // but might still be needed for damping from programmatic changes.
      // However, since we re-enable then rotate, it should be fine.
      if (controls.enabled) {
        controls.update(); 
      }
      
      renderer.render(scene, camera);
    }

    init();
  </script>
<script type="module" src="js/logos-companion.js"></script>
<logos-companion></logos-companion>
</body>
</html>
