<html>
<head>
  <title>Academy - Orbital View</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "OrbitControls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
      }
    }
  </script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      overflow: hidden; /* Prevent scrollbars */
      background-color: #0a0514; /* Dark mystical purple */
      color: #e0e0e0; /* Default light text color */
    }
    #3d-canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none; /* Allow clicks to pass through to canvas */
    }
    .hud h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
      color: #e0e0e0; /* Light lavender/grey */
      text-shadow: 0 0 5px rgba(172, 102, 255, 0.5);
    }
    .hud a {
      color: #b39ddb; /* Lighter mystical purple for links */
      text-decoration: none;
      pointer-events: auto; /* Enable clicks on the link */
      font-size: 1rem;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }
    .hud a:hover {
      text-decoration: underline;
      color: #ede7f6; /* Brighter on hover */
      text-shadow: 0 0 8px rgba(220, 180, 255, 0.7);
    }
    #instructions {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background-color: rgba(30, 20, 50, 0.75); /* Dark translucent purple */
      color: #d1c4e9; /* Pale lavender */
      padding: 12px;
      border-radius: 8px; /* Slightly softer radius */
      font-size: 0.9em;
      z-index: 100;
      line-height: 1.4;
      border: 1px solid rgba(126, 87, 194, 0.4); /* Subtle border */
      box-shadow: 0 0 15px rgba(40, 20, 70, 0.5);
    }
  </style>

<body>
  <div class="hud">
    <h1>Welcome to the Academy</h1>
    <p><a href="prime_nexus.html">Back to Prime Nexus</a></p>
  </div>
  
  <div id="3d-canvas-container"></div>

  <div id="instructions">
    <p><strong>Controls:</strong></p>
    <p>&bull; Drag mouse to orbit camera.</p>
    <p>&bull; Scroll to zoom.</p>
    <p>&bull; Press 'A' / 'D' to rotate view.</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'OrbitControls';

    let scene, camera, renderer, controls;
    let triCons = [];
    let keyRotateLeft = false;
    let keyRotateRight = false;
    let initialCameraDistance;

    function createGradientTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256; // Power of 2 for texture optimization
        canvas.height = 256;
        const context = canvas.getContext('2d');

        // Mystical Gradient (bottom to top)
        const gradient = context.createLinearGradient(0, canvas.height, 0, 0);
        gradient.addColorStop(0, '#3c1053'); // Deep dark purple (Logos-like)
        gradient.addColorStop(0.6, '#5c1f8b'); // Mid purple
        gradient.addColorStop(1, '#7e57c2');   // Lighter mystical purple/blue

        context.fillStyle = gradient;
        context.fillRect(0, 0, canvas.width, canvas.height);

        return new THREE.CanvasTexture(canvas);
    }


    function init() {
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0514); // Very dark purple/near black background

      // Camera
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000); // Increased far plane for stars
      camera.position.set(8, 7, 8); // Adjusted initial position for better view with larger plane
      
      // Renderer
      const canvasContainer = document.getElementById('3d-canvas-container');
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      canvasContainer.appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); // Slightly reduced ambient, texture will add brightness
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0); // Keep directional strong
      directionalLight.position.set(8, 15, 10);
      directionalLight.castShadow = true; 
      scene.add(directionalLight);

      // OrbitControls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 0.5, 0); 
      
      initialCameraDistance = camera.position.distanceTo(controls.target);

      // Central Plane with Gradient
      const planeGeometry = new THREE.PlaneGeometry(14, 14); // Made plane larger
      const gradientTexture = createGradientTexture();
      const planeMaterial = new THREE.MeshStandardMaterial({ 
        map: gradientTexture, 
        side: THREE.DoubleSide, 
        metalness: 0.2, // Lower metalness for less shine on gradient
        roughness: 0.8  // Higher roughness for diffuse look
      });
      const plane = new THREE.Mesh(planeGeometry, planeMaterial);
      plane.rotation.x = -Math.PI / 2; 
      plane.receiveShadow = true; 
      scene.add(plane);

      // Tri-con Definitions
      const triConData = [
        { name: "Academy Resource 1", geometry: new THREE.SphereGeometry(0.5, 32, 16), color: 0xe53e3e, rotationSpeed: new THREE.Vector3(0, 0.005, 0) }, // Red
        { name: "Academy Resource 2", geometry: new THREE.TetrahedronGeometry(0.6, 0), color: 0x3182ce, rotationSpeed: new THREE.Vector3(0.003, 0.003, 0) }, // Blue (d4)
        { name: "Academy Resource 3", geometry: new THREE.TorusKnotGeometry(0.4, 0.12, 100, 12), color: 0x38a169, rotationSpeed: new THREE.Vector3(0, -0.004, 0.002) }, // Green
        { name: "Academy Resource 4", geometry: new THREE.SphereGeometry(0.65, 32, 32), color: 0xdd6b20, rotationSpeed: new THREE.Vector3(0.006, 0, 0) } // Orange/Yellow Sphere
      ];
      
      const radius = 3.5; // Increased radius for larger plane
      const numTriCons = triConData.length;
      triConData.forEach((data, index) => {
        const angle = (index / numTriCons) * Math.PI * 2;
        const x = radius * Math.cos(angle);
        const z = radius * Math.sin(angle);
        
        const material = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.4, roughness: 0.5 });
        const mesh = new THREE.Mesh(data.geometry, material);
        mesh.position.set(x, 0.7, z); // Positioned on the circle, slightly above the plane
        mesh.userData.name = data.name;
        mesh.userData.rotationSpeed = data.rotationSpeed;
        mesh.castShadow = true; 
        scene.add(mesh);
        triCons.push(mesh);
      });

      // Starfield
      const starGeometry = new THREE.BufferGeometry();
      const starVertices = [];
      for (let i = 0; i < 15000; i++) { // Increased star count
        const x = THREE.MathUtils.randFloatSpread(1800); // Spread stars wider
        const y = THREE.MathUtils.randFloatSpread(1800);
        const z = THREE.MathUtils.randFloatSpread(1800);
        starVertices.push(x, y, z);
      }
      starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
      const starMaterial = new THREE.PointsMaterial({ 
          color: 0xffffff, 
          size: 0.8, // Slightly larger stars
          transparent: true, 
          opacity: 0.7,
          blending: THREE.AdditiveBlending // Brighter stars
        });
      const stars = new THREE.Points(starGeometry, starMaterial);
      scene.add(stars);
      
      updateZoomConstraints(true); 
      controls.update(); 

      // Event Listeners
      window.addEventListener('resize', onWindowResize, false);
      window.addEventListener('keydown', onKeyDown, false);
      window.addEventListener('keyup', onKeyUp, false);

      animate();
    }
    
    function getHorizontalFOV(verticalFOV, aspect) {
        return 2 * Math.atan(Math.tan(verticalFOV / 2) * aspect);
    }

    function updateZoomConstraints(isInitialSetup) {
        if (!controls || !camera) return;

        const triConCircleDiameter = 7.0; // Radius 3.5 * 2
        const largestTriConDiameter = 1.3; 
        const padding = 1.0; // Visual padding
        
        const requiredHorizontalSpan = triConCircleDiameter + largestTriConDiameter + padding;

        const verticalFOV = THREE.MathUtils.degToRad(camera.fov);
        const horizontalFOV = getHorizontalFOV(verticalFOV, camera.aspect);
        
        let minCalculatedDistance = requiredHorizontalSpan / (2 * Math.tan(horizontalFOV / 2));
        
        controls.minDistance = Math.max(2.0, minCalculatedDistance); // Increased min distance slightly

        if (isInitialSetup) {
            controls.maxDistance = initialCameraDistance * 1.5; // Allow a bit more zoom out
        }
        // console.log(`Zoom constraints: Min: ${controls.minDistance.toFixed(2)}, Max: ${controls.maxDistance.toFixed(2)}`);
    }


    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateZoomConstraints(false); 
    }

    function onKeyDown(event) {
        switch(event.key.toLowerCase()) {
            case 'a':
                event.preventDefault(); 
                // console.log("Key 'A' pressed - attempting to rotate left.");
                keyRotateLeft = true;
                break;
            case 'd':
                event.preventDefault(); 
                // console.log("Key 'D' pressed - attempting to rotate right.");
                keyRotateRight = true;
                break;
        }
    }

    function onKeyUp(event) {
        switch(event.key.toLowerCase()) {
            case 'a':
                keyRotateLeft = false;
                // console.log("Key 'A' released.");
                break;
            case 'd':
                keyRotateRight = false;
                // console.log("Key 'D' released.");
                break;
        }
    }

    function animate() {
      requestAnimationFrame(animate);

      const deltaRotation = 0.015; 
      if (keyRotateLeft) {
        controls.rotateLeft(deltaRotation);
      }
      if (keyRotateRight) {
        controls.rotateRight(deltaRotation);
      }

      triCons.forEach(triCon => {
        if (triCon.userData.rotationSpeed) {
            // Only rotate if not being affected by key rotation or mouse drag (optional, for smoother feel)
            // For now, let them always rotate
            triCon.rotation.x += triCon.userData.rotationSpeed.x;
            triCon.rotation.y += triCon.userData.rotationSpeed.y;
            triCon.rotation.z += triCon.userData.rotationSpeed.z;
        }
      });

      controls.update(); 
      renderer.render(scene, camera);
    }

    init();
  </script>
