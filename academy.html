<!DOCTYPE html>
<html>
<head>
  <title>Academy - Orbital View</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "OrbitControls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
      }
    }
  </script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      overflow: hidden; /* Prevent scrollbars */
      background-color: #111827; /* Dark background */
      color: #e5e7eb;
    }
    #3d-canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none; /* Allow clicks to pass through to canvas */
    }
    .hud h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
      color: #d1d5db;
    }
    .hud a {
      color: #93c5fd; /* Light blue for links */
      text-decoration: none;
      pointer-events: auto; /* Enable clicks on the link */
      font-size: 1rem;
    }
    .hud a:hover {
      text-decoration: underline;
    }
    #instructions {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background-color: rgba(0,0,0,0.6);
      color: white;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9em;
      z-index: 100;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="hud">
    <h1>Welcome to the Academy</h1>
    <p><a href="prime_nexus.html">Back to Prime Nexus</a></p>
  </div>
  
  <div id="3d-canvas-container"></div>

  <div id="instructions">
    <p><strong>Controls:</strong></p>
    <p>&bull; Drag mouse to orbit camera.</p>
    <p>&bull; Scroll to zoom.</p>
    <p>&bull; Press 'A' / 'D' to rotate view.</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'OrbitControls';

    let scene, camera, renderer, controls;
    let triCons = [];
    let keyRotateLeft = false;
    let keyRotateRight = false;
    let initialCameraDistance;

    function init() {
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a202c); // Dark blue-gray background

      // Camera
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(6, 6, 6); // Initial isometric-like position
      

      // Renderer
      const canvasContainer = document.getElementById('3d-canvas-container');
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      canvasContainer.appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8); // Brighter ambient
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2); // Stronger directional
      directionalLight.position.set(8, 15, 10);
      directionalLight.castShadow = true; // Optional: for future shadow effects
      scene.add(directionalLight);

      // OrbitControls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      // controls.minDistance will be set by updateZoomConstraints
      // controls.maxDistance will be set by updateZoomConstraints
      controls.target.set(0, 0.5, 0); // Target slightly above the plane's center
      
      initialCameraDistance = camera.position.distanceTo(controls.target); // Store initial distance

      // Central Plane
      const planeGeometry = new THREE.PlaneGeometry(10, 10);
      const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x38b2ac, side: THREE.DoubleSide, metalness: 0.3, roughness: 0.6 }); // Teal color
      const plane = new THREE.Mesh(planeGeometry, planeMaterial);
      plane.rotation.x = -Math.PI / 2; // Rotate to be horizontal
      plane.receiveShadow = true; // Optional
      scene.add(plane);

      // Tri-con Definitions
      const triConData = [
        { name: "Academy Resource 1", geometry: new THREE.SphereGeometry(0.5, 32, 16), color: 0xe53e3e, rotationSpeed: new THREE.Vector3(0, 0.005, 0) }, // Red
        { name: "Academy Resource 2", geometry: new THREE.TetrahedronGeometry(0.6, 0), color: 0x3182ce, rotationSpeed: new THREE.Vector3(0.003, 0.003, 0) }, // Blue (d4)
        { name: "Academy Resource 3", geometry: new THREE.TorusKnotGeometry(0.4, 0.12, 100, 12), color: 0x38a169, rotationSpeed: new THREE.Vector3(0, -0.004, 0.002) }, // Green
        { name: "Academy Resource 4", geometry: new THREE.SphereGeometry(0.65, 32, 32), color: 0xdd6b20, rotationSpeed: new THREE.Vector3(0.006, 0, 0) } // Orange/Yellow Sphere
      ];
      
      const radius = 2.5; // Radius of the circle for Tri-cons
      const numTriCons = triConData.length;
      triConData.forEach((data, index) => {
        const angle = (index / numTriCons) * Math.PI * 2;
        const x = radius * Math.cos(angle);
        const z = radius * Math.sin(angle);
        
        const material = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.4, roughness: 0.5 });
        const mesh = new THREE.Mesh(data.geometry, material);
        mesh.position.set(x, 0.6, z); // Positioned on the circle, slightly above the plane
        mesh.userData.name = data.name;
        mesh.userData.rotationSpeed = data.rotationSpeed;
        mesh.castShadow = true; // Optional
        scene.add(mesh);
        triCons.push(mesh);
      });
      
      updateZoomConstraints(true); // Set initial zoom constraints
      controls.update(); // Initial update for camera target and constraints

      // Event Listeners
      window.addEventListener('resize', onWindowResize, false);
      window.addEventListener('keydown', onKeyDown, false);
      window.addEventListener('keyup', onKeyUp, false);

      animate();
    }
    
    function getHorizontalFOV(verticalFOV, aspect) {
        return 2 * Math.atan(Math.tan(verticalFOV / 2) * aspect);
    }

    function updateZoomConstraints(isInitialSetup) {
        if (!controls || !camera) return;

        const triConCircleDiameter = 5.0; // Radius 2.5 * 2
        const largestTriConDiameter = 1.3; // Approx. Sphere with 0.65 radius = 1.3 diameter
        const padding = 0.8; // Visual padding on each side (total 1.6)
        
        // Required horizontal span to see all TriCons
        const requiredHorizontalSpan = triConCircleDiameter + largestTriConDiameter + padding;

        const verticalFOV = THREE.MathUtils.degToRad(camera.fov);
        const horizontalFOV = getHorizontalFOV(verticalFOV, camera.aspect);
        
        let minCalculatedDistance = requiredHorizontalSpan / (2 * Math.tan(horizontalFOV / 2));
        
        // Sanity check for minDistance, prevent it from being too small (e.g., camera inside objects)
        controls.minDistance = Math.max(1.5, minCalculatedDistance);

        if (isInitialSetup) {
            controls.maxDistance = initialCameraDistance; // Set max zoom out to initial position
        }
        // console.log(`Zoom constraints: Min: ${controls.minDistance.toFixed(2)}, Max: ${controls.maxDistance.toFixed(2)}`);
    }


    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateZoomConstraints(false); // Update zoom constraints on resize
    }

    function onKeyDown(event) {
        switch(event.key.toLowerCase()) {
            case 'a':
                keyRotateLeft = true;
                break;
            case 'd':
                keyRotateRight = true;
                break;
        }
    }

    function onKeyUp(event) {
        switch(event.key.toLowerCase()) {
            case 'a':
                keyRotateLeft = false;
                break;
            case 'd':
                keyRotateRight = false;
                break;
        }
    }

    function animate() {
      requestAnimationFrame(animate);

      const deltaRotation = 0.015; // Speed of keyboard rotation
      if (keyRotateLeft) {
        controls.rotateLeft(deltaRotation);
      }
      if (keyRotateRight) {
        controls.rotateRight(deltaRotation);
      }

      triCons.forEach(triCon => {
        if (triCon.userData.rotationSpeed) {
            triCon.rotation.x += triCon.userData.rotationSpeed.x;
            triCon.rotation.y += triCon.userData.rotationSpeed.y;
            triCon.rotation.z += triCon.userData.rotationSpeed.z;
        }
      });

      controls.update(); // Must be called for damping to work
      renderer.render(scene, camera);
    }

    init();
  </script>
<script src="js/logos-companion.js"></script>
<logos-companion></logos-companion>
</body>
</html>
